name: ef versions

# Weekly and on every push to main: .github/ef/versions.sh rewrites README.md's version table (ours vs upstream vs each
# key dependency). A change becomes a PR that auto-merges when `ef tests` is green.
# Rollback: disable this workflow; the table simply stops refreshing.

on:
  schedule:
    - cron: '53 8 * * 1' # Monday 08:53 UTC, after the weekly image rebuild
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

# gh in a fork's runner may default to the PARENT repo (it tried to label a PR on neondatabase/electric, 2026-11-14):
# every gh call here targets this repo.
env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ef-versions
  cancel-in-progress: true

jobs:
  table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ef/versions.sh
      - name: PR when it changed
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.EF_RADAR_DEPLOY_KEY }}
        run: |
          git diff --quiet README.md && { echo "table unchanged"; exit 0; }
          branch=ef/versions-table
          git config user.name "ef-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"; git commit -qam "ef: refresh the README version table"
          echo "Generated by ef-versions.yml (.github/ef/versions.sh). Auto-merges when \`ef tests\` is green." > "$RUNNER_TEMP/body.md"
          .github/ef/bot-pr.sh "$branch" "ef: refresh the README version table" "$RUNNER_TEMP/body.md" --auto
