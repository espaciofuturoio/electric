name: ef base images

# Weekly: raise the sync image's Elixir/OTP/Debian base to the newest PATCH on the same Elixir minor and OTP major
# (.github/ef/base-images.sh), as a PR that auto-merges when `ef tests` is green. Node's base is the floating
# `node:22-trixie-slim`, refreshed by ef-fork-images.yml's weekly no-cache rebuild; Dependabot proposes the tag change.
# Rollback: revert the merged PR; images already published keep their digests.

on:
  schedule:
    - cron: '7 5 * * 1' # Monday 05:07 UTC, before the weekly image rebuild (07:41)
  workflow_dispatch:

# gh in a fork's runner may default to the PARENT repo (it tried to label a PR on neondatabase/electric, 2026-11-14):
# every gh call here targets this repo.
env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    # GitHub-hosted: public fork, standard runners free; no self-hosted on public repos — owner 2026-11-22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: bump
        run: |
          out="$(.github/ef/base-images.sh)"; echo "$out"
          git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || { echo "changed=true" >> "$GITHUB_OUTPUT"; echo "summary=$out" >> "$GITHUB_OUTPUT"; }
      - name: PR, test dispatch, auto-merge
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.EF_RADAR_DEPLOY_KEY }}
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          branch="ef/base-images-$(date -u +%Y%m%d)"
          git config user.name "ef-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"; git commit -qam "ef: sync image base — $SUMMARY"
          echo "Patch-level base bump by ef-base-images.yml (same Elixir minor, OTP major, Debian bookworm). Auto-merges when \`ef tests\` is green. Rollback: revert." > "$RUNNER_TEMP/body.md"
          .github/ef/bot-pr.sh "$branch" "ef: sync image base — $SUMMARY" "$RUNNER_TEMP/body.md" --auto
