name: ef sync-service release

on:
  push:
    tags: ['sync-service-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag without prefix, e.g. 1.8.1-ef.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/espaciofuturoio/electric-sync-service

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-${REF_NAME#sync-service-v}}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ef\.[0-9]+$ ]] || { echo "bad tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: packages/sync-service
          file: packages/sync-service/Dockerfile
          build-contexts: |
            electric-telemetry=packages/electric-telemetry
          build-args: |
            ELECTRIC_VERSION=${{ steps.vars.outputs.tag }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/espaciofuturoio/electric
            org.opencontainers.image.revision=${{ github.sha }}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Postgres with logical replication
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=pw postgres:17 -c wal_level=logical
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          docker exec pg psql -U postgres -c "CREATE TABLE items (id int PRIMARY KEY, name text); INSERT INTO items VALUES (1, 'ef-smoke');"
      - name: Image serves a shape (insecure mode)
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          docker run -d --name open --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:pw@pg:5432/postgres?sslmode=disable \
            -e ELECTRIC_INSECURE=true -e ELECTRIC_REPLICATION_STREAM_ID=open "$REF"
          for i in $(seq 1 60); do curl -fs localhost:3000/v1/health | grep -q active && break; sleep 2; done
          curl -fs localhost:3000/v1/health
          body=$(curl -fs "localhost:3000/v1/shape?table=items&offset=-1")
          echo "$body"
          echo "$body" | grep -q ef-smoke
          curl -sI localhost:3000/v1/health | grep -i electric-server || true
          docker rm -f open
      - name: Secret cannot be bypassed (GHSA-m4f6-p2j8-rq76)
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          docker run -d --name locked --network smoke -p 3001:3000 \
            -e DATABASE_URL=postgresql://postgres:pw@pg:5432/postgres?sslmode=disable \
            -e ELECTRIC_SECRET=smoke-secret -e ELECTRIC_REPLICATION_STREAM_ID=locked "$REF"
          for i in $(seq 1 60); do curl -fs localhost:3001/v1/health | grep -q active && break; sleep 2; done
          for path in "/v1/shape" "/v1/shape/" "/v1//shape" "/v1/shape//"; do
            code=$(curl --path-as-is -s -o /dev/null -w "%{http_code}" "localhost:3001${path}?table=items&offset=-1")
            echo "$path -> $code"
            [ "$code" = "401" ] || { echo "secret bypass on $path"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" "localhost:3001/v1/shape?table=items&offset=-1&secret=smoke-secret")
          echo "with secret -> $code"; [ "$code" = "200" ]
      - name: Logs on failure
        if: failure()
        run: docker logs open || true; docker logs locked || true

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          gh release create "sync-service-v${TAG}" --target "${GITHUB_SHA}" --title "sync-service ${TAG}" \
            --notes "Image: \`${IMAGE}:${TAG}\` (\`${DIGEST}\`). Smoke passed: shape round-trip and secret-bypass paths → 401. Patch list: FORK.md." \
            || gh release edit "sync-service-v${TAG}" --notes "Image: \`${IMAGE}:${TAG}\` (\`${DIGEST}\`). Smoke passed."
